[package]
name = "pdf-edit-app"
version = "0.1.0"
edition = "2021"
description = "pdf-edit web app (Leptos + WASM)"
license = "Apache-2.0"

[dependencies]
pdf-edit-core = { path = "../core" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
hayro = "0.7.1"
web-sys = { version = "0.3", features = [
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "File",
  "Blob",
  "BlobPropertyBag",
  "HtmlInputElement",
  "FileList",
  "Url",
  "HtmlAnchorElement",
  "Document",
  "Window",
  "Element",
  "HtmlElement",
  "PointerEvent",
  "KeyboardEvent",
  "DomRect",
  "CssStyleDeclaration",
] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
lopdf = "0.44"
